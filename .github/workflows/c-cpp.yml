name: Build APK Windows (Debug Version)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout our optimized repository
        uses: actions/checkout@v4

      - name: Checkout upstream repository with LFS
        uses: actions/checkout@v4
        with:
          repository: Kallzzxa/SA-MP-Mobile-Launcher
          lfs: true
          path: upstream-repo

      - name: Copy real LFS binary files from upstream
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $upstream = Join-Path $root "upstream-repo"
          Get-ChildItem -Path $upstream -Recurse -Include *.so, *.a | ForEach-Object {
              $fullPath = $_.FullName
              $relPath = $fullPath.Substring($upstream.Length).TrimStart('\', '/')
              $destPath = Join-Path $root $relPath
              $destDir = Split-Path -Parent $destPath
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir }
              Copy-Item -Path $fullPath -Destination $destPath -Force
              Write-Host "Restored binary: $relPath ($($_.Length) bytes)"
          }
          Remove-Item -Recurse -Force $upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Enable long paths
        shell: powershell
        run: |
          git config --system core.longpaths true
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Grant gradlew permission
        shell: cmd
        run: |
          if not exist gradlew.bat exit /b 1

      # Build APK
      - name: Build Debug APK
        shell: cmd
        run: |
          gradlew.bat assembleRelease -Pandroid.injected.build.abi=arm64-v8a --stacktrace

      - name: List generated APKs
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.apk | Select-Object FullName, Length
          New-Item -ItemType Directory -Force -Path "release-apks"
          Get-ChildItem -Path "app\build" -Recurse -Filter *.apk | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "release-apks" -Force
          }
          Get-ChildItem -Path "release-apks" -Filter *.apk | Select-Object FullName, Length

      # Verify APK signature scheme
      - name: Verify APK Signatures
        shell: cmd
        run: |
          for /r release-apks %%f in (*.apk) do (
            echo ==============================================
            echo Verifying %%f
            call "%ANDROID_HOME%\build-tools\34.0.0\apksigner.bat" verify --verbose "%%f"
            echo ==============================================
          )

      # Upload Artifacts
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: release-apks/*.apk

      # Create GitHub Release
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build v${{ github.run_number }}
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

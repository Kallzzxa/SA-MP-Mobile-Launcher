<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Downloading resources</title>
    <style>
        html, body {
            margin: 0; height: 100%;
            font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
            background: transparent; color: #e7eefc;
        }
        .wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
        .card {
            width: min(560px, 92vw);
            padding: 18px 18px 14px;
            border-radius: 16px;
            background: rgba(26, 26, 26, 0.92);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
        }
        .title { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
        .sub { opacity: 0.75; font-size: 13px; margin: 0 0 14px; }
        .bar { height: 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
        .fill { height: 100%; width: 0%; background: #4e7eff; transition: width 0.15s linear; }
        .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 12px; opacity: 0.85; }
        .file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <p class="title">Downloading resources...</p>
            <p class="sub" id="sub">Loading...</p>
            <div class="bar"><div class="fill" id="fill"></div></div>
            <div class="row">
                <div class="file" id="file">-</div>
                <div id="pct">0%</div>
            </div>
            <div class="row">
                <div id="speed">0 KB/s</div>
            </div>
        </div>
    </div>
    <script>
        // Served at: cef://__internal/loading.html  (PC omp-cef: http://cef/__internal/loading.html)
        // Native can call:
        //   window.__ompcef.manifest(filesCount, totalBytes)
        //   window.__ompcef.progress(fileName, fileReceived, fileTotal, overallReceived, overallTotal)
        //   window.__ompcef.done()
        const elFill = document.getElementById('fill');
        const elPct = document.getElementById('pct');
        const elSub = document.getElementById('sub');
        const elFile = document.getElementById('file');
        const elSpeed = document.getElementById('speed');

        let total = 0, got = 0;
        let targetPct = 0, smoothPct = 0;
        let lastT = performance.now(), lastGot = 0;

        function fmtBytes(n) {
            const u = ["B", "KB", "MB", "GB"];
            let i = 0;
            while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
            return n.toFixed(i ? 2 : 0) + ' ' + u[i];
        }

        function tickSpeed() {
            const now = performance.now();
            const dt = (now - lastT) / 1000;
            if (dt <= 0.10) return;
            const sp = (got - lastGot) / dt;
            elSpeed.textContent = fmtBytes(sp) + '/s';
            lastT = now; lastGot = got;
        }
        setInterval(tickSpeed, 200);

        function raf() {
            smoothPct += (targetPct - smoothPct) * 0.15;
            const pct = Math.max(0, Math.min(100, smoothPct));
            elFill.style.width = pct.toFixed(2) + '%';
            elPct.textContent = Math.round(pct) + '%';
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        window.__ompcef = {
            manifest: (files, bytes) => {
                total = bytes | 0;
                elSub.textContent = files + ' file(s) • ' + fmtBytes(total);
            },
            progress: (fileName, fileReceived, fileTotal, overallReceived, overallTotal) => {
                got = overallReceived | 0;
                total = overallTotal | 0;
                targetPct = total ? (got / total) * 100 : 0;
                elFile.textContent = fileName || '-';
                elSub.textContent = fmtBytes(fileReceived) + ' / ' + fmtBytes(fileTotal) +
                    ' • Total ' + fmtBytes(got) + ' / ' + fmtBytes(total);
            },
            done: () => {
                targetPct = 100;
                elSub.textContent = 'Done';
                elFile.textContent = '-';
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>SA-MP Mobile CEF</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
            font-family:
                Inter,
                Roboto,
                Arial,
                sans-serif;
        }

        /* =====================================================
           NOTIFICATION CONTAINER
           ===================================================== */

        #notification-container {
            position: fixed;

            right: 28px;
            top: 50%;

            transform: translateY(-50%);

            width: 360px;

            display: flex;
            flex-direction: column;
            gap: 10px;

            pointer-events: none;
        }

        /* =====================================================
           NOTIFICATION
           ===================================================== */

        .notification {
            position: relative;

            width: 100%;
            min-height: 82px;

            padding: 14px 16px 17px 14px;

            display: flex;
            align-items: center;

            overflow: hidden;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(25, 27, 32, 0.96),
                    rgba(13, 15, 19, 0.94)
                );

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            opacity: 0;

            transform:
                translateX(45px)
                scale(0.96);

            transition:
                opacity 260ms ease,
                transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .notification.show {
            opacity: 1;

            transform:
                translateX(0)
                scale(1);
        }

        .notification.hide {
            opacity: 0;

            transform:
                translateX(45px)
                scale(0.96);

            transition:
                opacity 220ms ease,
                transform 220ms ease;
        }

        /* =====================================================
           ICON
           ===================================================== */

        .notification-icon {
            width: 48px;
            height: 48px;

            min-width: 48px;

            margin-right: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: rgba(255, 255, 255, 0.07);

            font-size: 22px;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* =====================================================
           CONTENT
           ===================================================== */

        .notification-content {
            min-width: 0;

            flex: 1;
        }

        .notification-title {
            margin: 0 0 4px 0;

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            letter-spacing: 0.15px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .notification-message {
            margin: 0;

            color: rgba(255, 255, 255, 0.66);

            font-size: 12px;
            line-height: 17px;

            white-space: normal;
            word-break: break-word;
        }

        /* =====================================================
           CLOSE
           ===================================================== */

        .notification-close {
            position: absolute;

            top: 9px;
            right: 11px;

            width: 22px;
            height: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(255, 255, 255, 0.38);

            font-size: 16px;

            cursor: pointer;

            pointer-events: auto;

            border-radius: 50%;

            transition:
                background 150ms ease,
                color 150ms ease;
        }

        .notification-close:active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        /* =====================================================
           PROGRESS BAR
           ===================================================== */

        .notification-progress {
            position: absolute;

            left: 0;
            bottom: 0;

            height: 2px;

            width: 100%;

            transform-origin: left center;

            background: var(--accent);

            animation:
                notification-progress var(--duration)
                linear forwards;
        }

        @keyframes notification-progress {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }

        /* =====================================================
           TYPES
           ===================================================== */

        .notification.success {
            --accent: #43e97b;
        }

        .notification.success .notification-icon {
            color: #43e97b;

            background:
                rgba(67, 233, 123, 0.10);
        }

        .notification.info {
            --accent: #4da3ff;
        }

        .notification.info .notification-icon {
            color: #4da3ff;

            background:
                rgba(77, 163, 255, 0.10);
        }

        .notification.warning {
            --accent: #ffc857;
        }

        .notification.warning .notification-icon {
            color: #ffc857;

            background:
                rgba(255, 200, 87, 0.10);
        }

        .notification.error {
            --accent: #ff5c7a;
        }

        .notification.error .notification-icon {
            color: #ff5c7a;

            background:
                rgba(255, 92, 122, 0.10);
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            #notification-container {
                right: 14px;

                width:
                    calc(100% - 28px);

                max-width: 360px;
            }

            .notification {
                min-height: 76px;

                padding: 12px 14px 15px 12px;

                border-radius: 13px;
            }

            .notification-icon {
                width: 43px;
                height: 43px;

                min-width: 43px;

                margin-right: 11px;

                font-size: 20px;
            }

            .notification-title {
                font-size: 13px;
            }

            .notification-message {
                font-size: 11px;
                line-height: 16px;
            }
        }
    </style>
</head>

<body>

<div id="notification-container"></div>

<script>

    /*
     * =========================================================
     * SA:MP MOBILE NOTIFICATION SYSTEM
     * =========================================================
     *
     * Native / CEF bisa memanggil:
     *
     * showNotify(
     *     "success",
     *     "SERVER",
     *     "Berhasil terhubung ke server!",
     *     4000
     * );
     *
     * type:
     * success
     * info
     * warning
     * error
     */

    const notificationContainer =
        document.getElementById("notification-container");


    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text ?? "";

        return div.innerHTML;
    }


    function getIcon(type) {

        switch (type) {

            case "success":
                return "✓";

            case "warning":
                return "⚠";

            case "error":
                return "×";

            case "info":
            default:
                return "i";
        }
    }


    function showNotify(
        type = "info",
        title = "Notification",
        message = "",
        duration = 4000
    ) {

        duration =
            Math.max(
                1500,
                Number(duration) || 4000
            );


        const notification =
            document.createElement("div");

        notification.className =
            `notification ${type}`;


        notification.innerHTML = `
            <div class="notification-icon">
                ${getIcon(type)}
            </div>

            <div class="notification-content">

                <div class="notification-title">
                    ${escapeHtml(title)}
                </div>

                <div class="notification-message">
                    ${escapeHtml(message)}
                </div>

            </div>

            <div class="notification-close">
                ×
            </div>

            <div
                class="notification-progress"
                style="--duration: ${duration}ms"
            ></div>
        `;


        notificationContainer.appendChild(
            notification
        );


        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                notification.classList.add("show");

            });

        });


        const closeButton =
            notification.querySelector(
                ".notification-close"
            );


        let closed = false;


        function close() {

            if (closed)
                return;

            closed = true;

            notification.classList.remove("show");
            notification.classList.add("hide");


            setTimeout(() => {

                notification.remove();

            }, 250);
        }


        closeButton.addEventListener(
            "click",
            close
        );


        setTimeout(
            close,
            duration
        );


        return notification;
    }


    /*
     * =========================================================
     * TEST
     * =========================================================
     *
     * Hapus / comment bagian ini setelah testing.
     */

    setTimeout(() => {

        showNotify(
            "success",
            "SERVER",
            "Berhasil terhubung ke server!",
            4500
        );

    }, 500);


    /*
     * =========================================================
     * GLOBAL API
     * =========================================================
     *
     * Bisa dipanggil dari native melalui evaluateJavascript:
     *
     * showNotify("success", "SERVER", "Welcome!", 4000);
     *
     */

    window.showNotify = showNotify;

</script>

</body>
</html>

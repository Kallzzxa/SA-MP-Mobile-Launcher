<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin:0; background:transparent; color:#fff; font-family:sans-serif; }
#box { position:fixed; left:20px; top:20px; background:rgba(0,0,0,.6); padding:16px; border-radius:12px; }
button { padding:10px 18px; border:0; border-radius:8px; background:#f0b429; font-weight:bold; }
</style></head><body>
<div id="box">
  <h2 id="title">omp-cef demo</h2>
  <p id="msg">menunggu server...</p>
  <button onclick="cef.emit('demo_button', 'ok')">Kirim ke server</button>
</div>
<script>
cef.on('ui_welcome', function(text) { document.getElementById('msg').textContent = text; });
cef.on('ui_reply', function(text) { document.getElementById('msg').textContent = text; });
</script>
</body></html>
